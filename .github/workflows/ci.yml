name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-unknown-unknown
            package-dir: pkg
          - target: wasm64-unknown-unknown
            package-dir: pkg-wasm64
    env:
      WASM_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Setup wasm64 Rust toolchain
        if: matrix.target == 'wasm64-unknown-unknown'
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Build WASM package
        run: make build

      - name: Validate package and JavaScript API
        run: node --test tests/check-package.test.mjs tests/package.test.mjs

      - name: Example tests
        working-directory: example
        run: |
          npm install --no-save ../${{ matrix.package-dir }}
          node --test wasm-similarity.test.ts
