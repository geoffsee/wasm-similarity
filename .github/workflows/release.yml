name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-unknown-unknown
            package-dir: pkg
          - target: wasm64-unknown-unknown
            package-dir: pkg-wasm64
    env:
      WASM_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Setup wasm64 Rust toolchain
        if: matrix.target == 'wasm64-unknown-unknown'
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Build package
        run: make build

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure modern npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Validate package and JavaScript API
        run: node --test tests/check-package.test.mjs tests/package.test.mjs

      - name: Example tests
        working-directory: example
        run: |
          npm install --no-save ../${{ matrix.package-dir }}
          node --test wasm-similarity.test.ts

      - name: Publish pkg to npm
        working-directory: ${{ matrix.package-dir }}
        # The package's publishConfig selects latest for wasm32 and wasm64
        # for the opt-in prerelease, preserving the default install target.
        run: |
          PUBLISH_TAG=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).publishConfig.tag')
          npm publish --access public --provenance --ignore-scripts --tag "$PUBLISH_TAG"
