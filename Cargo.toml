[package]
name = "wasm-similarity"
version = "1.0.7"
authors = ["geoffsee"]
edition = "2024"
description = "WebAssembly-powered cosine similarity utilities for JavaScript/TypeScript"
license = "AGPL-3.0"
readme = "README.md"
keywords = ["wasm", "webassembly", "similarity", "cosine", "vectors"]
categories = ["wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "=0.2.101"
# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.6", optional = true }

web-sys = { version = "0.3.77", features = ["console"] }
getrandom = {version = "0.2", features = ["js"]}

[dev-dependencies]
wasm-bindgen-test = "0.3.50"
rust-embed = { version =  "8.7.2", default-features = false, features = ["include-exclude", "interpolate-folder-path"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"

[profile.release]
opt-level = 3
lto = true
strip = true
